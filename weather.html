<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App 🌤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #fff7f3, #f5f5f5);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2f2f2f;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .search-box {
            margin-top: 20px;
        }

        input {
            width: 65%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #d14715, #ff6a2a);
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-left: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .weather-result {
    margin-top: 30px;
    padding: 30px; /* was 25px */
    border-radius: 18px;
    background: linear-gradient(to bottom, #fff4ef, #ffffff);
    box-shadow: 0 8px 20px rgba(209, 71, 21, 0.08);
}

.weather-result h2 {
    margin-bottom: 5px;
    color: #2f2f2f;
}

#weatherIcon {
    width: 90px;
    height: 90px;
    display: none;
    margin: 10px auto;
}

.temp {
    font-size: 42px;
    font-weight: bold;
    color: #d14715;
    margin: 8px 0;
}

.condition {
    font-size: 18px;
    color: #555;
    font-weight: bold;
    letter-spacing: 0.5px;
}

        @media (max-width: 600px) {
            input {
                width: 100%;
                margin-bottom: 10px;
            }

            button {
                width: 100%;
                margin: 0;
            }

            .search-box {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Project Cicco Weather 🐶🌤️</h1>
        <p>Check the weather anywhere in the world</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <div class="weather-result">
        <h2 id="cityName">City Name</h2>
        <p class="temp" id="temperature">--°C</p>
        <p class="condition" id="condition">Weather condition</p>
        <img id="weatherIcon" src="" alt="" style="margin-top:10px;">
        </div>
    </div>
<script>
const apiKey = "dcdaa38484abc12106f09cb597224a4d";

async function getWeather() {
    const city = document.getElementById("cityInput").value.trim();

    if (city === "") {
        document.getElementById("cityName").textContent = "Please enter a city 🏙️";
        document.getElementById("temperature").textContent = "";
        document.getElementById("condition").textContent = "";
        document.getElementById("weatherIcon").style.display = "none";
        return;
    }
    document.getElementById("cityName").textContent = "Loading...";
    document.getElementById("temperature").textContent = "";
    document.getElementById("condition").textContent = "";
    document.getElementById("weatherIcon").style.display = "none";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod != 200) {
            document.getElementById("cityName").textContent = "City not found 😢";
            document.getElementById("weatherIcon").style.display = "none";
            return;
        }

        document.getElementById("cityName").textContent = data.name;
document.getElementById("temperature").textContent = Math.round(data.main.temp) + "°C";

let conditionText = data.weather[0].description;
conditionText = conditionText.charAt(0).toUpperCase() + conditionText.slice(1);
document.getElementById("condition").textContent = conditionText;

const iconCode = data.weather[0].icon;
const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
document.getElementById("weatherIcon").src = iconUrl;
document.getElementById("weatherIcon").style.display = "block";
    } catch (error) {
        document.getElementById("cityName").textContent = "Something went wrong ⚠️";
        document.getElementById("weatherIcon").style.display = "none";
    }
}
document.getElementById("cityInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        getWeather();
    }
});
</script>
</body>
</html>
